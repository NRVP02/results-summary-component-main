<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> 
  <link href="./styles.css" rel="stylesheet" >
  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">
  
  <title>Frontend Mentor | Results summary component</title>
</head>
<body>
<main>
<section class="card">
<div class="result">
<h2 class="title"> Your Result </h2>

<div class="circulo"> 
   <p class="puntaje"> 76 </p>
   <p class="of"> of 100 </p>
</div>
<h3 class="subtitle">  Great </h3>
<p class="texto"> You scored higher than 65% of the
   people who have taken these tests. </p>
 
</div>
<div class="summary">

<h2 class="title"> Summary </h2> 

<div class="summary-iten reaction">
  <div class="data"> 
  <img src="./assets/images/icon-reaction.svg" alt="icon-reaction"/>
  <p>  Reaction </p>
  </div>
  <p  class="score"> 80 <span>/ 100 </span> </p> 
</div>
  
<div class="summary-iten memory">
  <div class="data"> 
  <img src="./assets/images/icon-memory.svg" alt="icon-memory"/>
  <p>   Memory  </p>
  </div>
  <p  class="score"> 92  <span> / 100 </span> </p> 
</div>
 
 
<div class="summary-iten verbal">
  <div class="data"> 
  <img src="./assets/images/icon-verbal.svg" alt="icon-verbal"/>
  <p>    Verbal  </p>
  </div>
  <p  class="score"> 61  <span> / 100 </span> </p> 
</div>

 
<div class="summary-iten visual">
  <div class="data"> 
  <img src="./assets/images/icon-visual.svg" alt="icon-visual"/>
  <p>    Visual </p>
  </div>
  <p  class="score">  73 <span> / 100 </span> </p> 
</div>
   <button class="continue-btn">  Continue </button>
</div>
</section>
</main>
  
</body>
</html>
